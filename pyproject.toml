[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rlinf-lingbotvla"
version = "0.1.0"
description = "Pinned LingBot-VLA inference runtime maintained by RLinf"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {file = "LICENSE"}
authors = [
    {name = "Robbyant Team"},
    {name = "RLinf Contributors"},
]
maintainers = [
    {name = "RLinf Team"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
# NOTE: LeRobot has been cut from the inference path (this commit series):
# ``deploy`` uses transformers' ``PretrainedConfig`` / ``nn.Module`` instead of
# lerobot's ``PreTrainedConfig`` / ``PreTrainedPolicy``, and the training/data-
# only lerobot imports are lazy (inside functions / package ``__getattr__``).
# The runtime therefore no longer installs lerobot and no longer ships the
# ``apply-lerobot-slim`` workaround. Inference is bitwise-identical to the
# lerobot baseline (``max_abs_diff=0.0``, ``bitwise_equal=True``, verified).
# Training still needs lerobot; install it separately in a training env.
#
# Deps below were classified by a real inference import trace (construct
# ``LingbotVLAServer`` + run one infer, inspect ``sys.modules``). 20 of 29
# are reached on the inference path and stay in ``dependencies``; the 9 NOT
# imported during inference are moved to the ``[train]`` extra:
#   ``blobfile``, ``datasets``, ``gymnasium``, ``matplotlib``, ``numpydantic``,
#   ``omegaconf``, ``tensorboard``, ``termcolor``, ``torchaudio``.
# The removal test confirmed bitwise parity (``max_abs_diff=0.0``).
# ``xxhash`` was also removed: it is not imported by any LingBot code (it was
# only a transitive dep of lerobot/datasets) and the uninstall-verify rerun
# was bitwise-identical.
# ``gymnasium==0.29.1`` is NOT on the VLA-inference path — it is owned by the
# RoboTwin *env* runtime (``rlinf-robotwin-runtime`` pins it), not by LingBot,
# so moving it here does not remove it from the installed ``[robotwin]`` env.
dependencies = [
    "accelerate>=1.10.0,<2.0.0",
    "av>=14.2.0",
    "diffusers==0.35.1",
    "draccus==0.10.0",
    "einops>=0.8.0",
    "huggingface-hub[cli]>=0.34,<1.0",
    "msgpack",
    "numpy==1.26.4",
    "packaging>=24.2",
    "pillow>=10",
    "pyyaml",
    "safetensors",
    "simplejson>=3.19",
    "torch==2.7.1",
    "torchdata>=0.8.0,<1.0",
    "torchvision==0.22.1",
    "tqdm",
    # Round 3: bumped 4.51.3 -> 4.57.6 (pinned to the exact verified version).
    # Aligns with OpenPI (``>=4.57.1,<4.58``) and RLDX-rpent
    # (``>=4.57.1,<4.58``) without claiming the untested range. The deep
    # transformers internals used by the in-repo modeling files
    # (SlidingWindowCache / ALL_ATTENTION_FUNCTIONS / _flash_attention_forward)
    # moved in 4.52+; deploy forces ``attention_implementation='eager'`` so the
    # flash path is dormant, but imports still run. Round 3 Gate 2 is a
    # single-variable A/B (only transformers differs) on fixed inference — any
    # drift isolates to this bump with no bisect needed.
    "transformers==4.57.6",
    "websockets",
]

[project.optional-dependencies]
# Deps that are NOT on the deploy/inference path (confirmed by the Phase 2
# import trace + removal test, ``max_abs_diff = 0.0``) are kept here for
# training / dataset builds. ``torchcodec`` is data-path only
# (``lingbotvla/data/vla_data/base_dataset.py``); ``datasets==3.6.0`` is data-
# path only (``lingbotvla/data/dataset.py`` + ``base_dataset.py`` import it,
# but those modules are reached only via the lazy ``data/__init__`` /
# ``vla_data/__init__`` accessors, never during inference); the rest were moved
# out of ``dependencies`` by Phase 2 because they are never imported during
# inference (see the NOTE above for the per-package list).
train = [
    "blobfile>=3.0.0",
    "datasets==3.6.0",
    "gymnasium==0.29.1",
    "matplotlib",
    "numpydantic",
    "omegaconf>=2.3.0",
    "tensorboard==2.16.2",
    "termcolor>=2.4.0",
    "torchaudio==2.7.1",
    "torchcodec==0.5",
]

[project.scripts]

[project.urls]
Homepage = "https://github.com/RLinf/lingbot-vla"
Repository = "https://github.com/RLinf/lingbot-vla"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["deploy*", "lingbotvla*"]
exclude = ["scripts*", "tasks*", "tests*"]

[tool.setuptools.package-data]

[tool.ruff]
target-version = "py310"
line-length = 119
indent-width = 4

[tool.ruff.lint]
ignore = ["C901", "E501", "E741", "W605", "C408"]
select = ["C", "E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "F811"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["lingbotvla"]
known-third-party = ["torch", "transformers", "wandb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
